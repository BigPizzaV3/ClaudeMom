[workspace]
resolver = "2"
members = [
  "crates/claude-local",
  "apps/claude-mom/src-tauri",
]

[workspace.package]
version = "0.1.2"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/BigPizzaV3/ClaudeMom"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
directories = "6"
futures-util = "0.3"
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls", "rustls-tls-native-roots", "system-proxy"], default-features = false }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sherpa-onnx = "1.13.8"
tempfile = "3"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "time"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
uuid = { version = "1", features = ["v4"] }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
