[package]
name = "claude-local"
description = "Claude Desktop 完整功能模式核心：本地兼容服务、证书、profile 切换与启动"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# 本地听写：SenseVoice 模型下载 / 转写引擎 + 给本地兼容服务用的转写服务（ClaudeMom 打开；Codex++ 用自己的 helper）。
dictation = ["dep:sherpa-onnx", "dep:tokio", "dep:tokio-tungstenite", "dep:futures-util", "dep:reqwest"]

[dependencies]
anyhow.workspace = true
base64.workspace = true
directories.workspace = true
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
serde.workspace = true
serde_json.workspace = true
sha1 = "0.10"
sha2.workspace = true
time = "0.3"
url = "2"
uuid.workspace = true
futures-util = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
sherpa-onnx = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["io-util", "net", "sync"] }
tokio-tungstenite = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Networking_WinHttp",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile.workspace = true
